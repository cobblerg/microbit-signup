<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>참가 신청서</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    /* 행사 안내 공지 카드 스타일 */
    .event-info-box {
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
      font-size: 13.5px;
      line-height: 1.6;
      color: #334155;
    }
    .event-info-title {
      font-weight: 700;
      font-size: 14px;
      color: #1e293b;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .event-info-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .event-info-list li {
      display: flex;
      align-items: flex-start;
      gap: 6px;
    }
    .event-info-label {
      font-weight: 600;
      color: #2563eb;
      white-space: nowrap;
      min-width: 52px;
    }
    .event-info-desc {
      color: #475569;
      word-break: keep-all;
    }
  </style>
</head>
<body>
  <div class="container">
    <main class="card">
      <header class="header">
        <span class="badge">AI정보교육연구회(PAGE)</span>
        <h1 class="title">마이크로비트와 함께</h1>
        <p class="subtitle">선착순 정원이 차면 자동으로 접수가 마감됩니다.</p>
      </header>

      <!-- 행사 상세 안내 공지 박스 -->
      <section class="event-info-box" aria-label="행사 안내">
        <div class="event-info-title">
          📌 <span>행사 안내</span>
        </div>
        <ul class="event-info-list">
          <li>
            <span class="event-info-label">일시</span>
            <span class="event-info-desc"><strong>2026년 10월 7일(수) 17시부터</strong></span>
          </li>
          <li>
            <span class="event-info-label">장소</span>
            <span class="event-info-desc">서울대학교사범대학부설중학교 신관 4층 정보교과교실</span>
          </li>
          <li>
            <span class="event-info-label">주제</span>
            <span class="event-info-desc">마이크로비트와 함께</span>
          </li>
          <li>
            <span class="event-info-label">체험사례</span>
            <span class="event-info-desc">마이크로비트 확장보드(지니어스키트), 마퀸, 레트로 아케이드, XGO 라이더, 비트독, 스마트 시계키트</span>
          </li>
        </ul>
      </section>

      <!-- 상단 모드 전환 탭 (신청 / 취소) -->
      <div class="tab-container">
        <button type="button" class="tab-btn active" id="tabApply" onclick="switchTab('apply')">신청하기</button>
        <button type="button" class="tab-btn" id="tabCancel" onclick="switchTab('cancel')">신청 취소</button>
      </div>

      <!-- 1. 참가 신청 폼 -->
      <form id="signupForm" class="form">
        <div class="input-group">
          <label for="userName">이름 <span class="required">*</span></label>
          <input 
            type="text" 
            id="userName" 
            name="userName" 
            required 
            placeholder="예: 홍길동"
            autocomplete="name"
          >
        </div>

        <div class="input-group">
          <label for="schoolName">학교 <span class="required">*</span></label>
          <input 
            type="text" 
            id="schoolName" 
            name="schoolName" 
            required 
            placeholder="예: 한국대학교"
          >
        </div>

        <div class="input-group">
          <label for="phoneNumber">전화번호 <span class="required">*</span></label>
          <input 
            type="tel" 
            id="phoneNumber" 
            name="phoneNumber" 
            required 
            placeholder="예: 010-1234-5678"
            pattern="[0-9]{2,3}-?[0-9]{3,4}-?[0-9]{4}"
            title="올바른 전화번호 형식을 입력해 주세요 (예: 010-1234-5678)"
          >
        </div>

        <button type="submit" id="submitButton" class="submit-btn">
          <span class="btn-text">신청 완료하기</span>
          <span class="spinner" aria-hidden="true"></span>
        </button>
      </form>

      <!-- 2. 신청 취소 폼 (기본 숨김) -->
      <form id="cancelForm" class="form" style="display: none;">
        <div class="notice-box">
          신청 시 입력하셨던 <strong>이름</strong>과 <strong>전화번호</strong>를 입력하시면 접수가 취소됩니다.
        </div>

        <div class="input-group">
          <label for="cancelUserName">이름 <span class="required">*</span></label>
          <input 
            type="text" 
            id="cancelUserName" 
            name="cancelUserName" 
            required 
            placeholder="예: 홍길동"
          >
        </div>

        <div class="input-group">
          <label for="cancelPhoneNumber">전화번호 <span class="required">*</span></label>
          <input 
            type="tel" 
            id="cancelPhoneNumber" 
            name="cancelPhoneNumber" 
            required 
            placeholder="예: 010-1234-5678"
            pattern="[0-9]{2,3}-?[0-9]{3,4}-?[0-9]{4}"
          >
        </div>

        <button type="submit" id="cancelButton" class="submit-btn cancel-btn">
          <span class="btn-text">신청 취소하기</span>
          <span class="spinner" aria-hidden="true"></span>
        </button>
      </form>

      <!-- 결과 메시지 (성공 / 실패 / 마감) -->
      <div id="statusMessage" class="status-message" style="display: none;"></div>

      <footer class="footer">
        <p>🔒 입력하신 개인정보는 신청 확인용으로만 안전하게 사용됩니다.</p>
      </footer>
    </main>
  </div>

  <script src="app.js?v=7"></script>
</body>
</html>
