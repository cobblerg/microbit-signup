<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>참가 신청서</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <main class="card">
      <header class="header">
        <span class="badge">선착순 접수</span>
        <h1 class="title">프로그램 참가 신청</h1>
        <p class="subtitle">선착순 정원이 차면 자동으로 접수가 마감됩니다.</p>
      </header>

      <!-- 신청 입력 폼 -->
      <form id="signupForm" class="form">
        <div class="input-group">
          <label for="userName">이름 <span class="required">*</span></label>
          <input 
            type="text" 
            id="userName" 
            name="userName" 
            required 
            placeholder="예: 홍길동"
            autocomplete="name"
          >
        </div>

        <div class="input-group">
          <label for="schoolName">학교 <span class="required">*</span></label>
          <input 
            type="text" 
            id="schoolName" 
            name="schoolName" 
            required 
            placeholder="예: 한국대학교"
          >
        </div>

        <div class="input-group">
          <label for="phoneNumber">전화번호 <span class="required">*</span></label>
          <input 
            type="tel" 
            id="phoneNumber" 
            name="phoneNumber" 
            required 
            placeholder="예: 010-1234-5678"
            pattern="[0-9]{2,3}-?[0-9]{3,4}-?[0-9]{4}"
            title="올바른 전화번호 형식을 입력해 주세요 (예: 010-1234-5678)"
          >
        </div>

        <button type="submit" id="submitButton" class="submit-btn">
          <span class="btn-text">신청 완료하기</span>
          <span class="spinner" aria-hidden="true"></span>
        </button>
      </form>

      <!-- 결과 메시지 (성공 / 실패 / 마감) -->
      <div id="statusMessage" class="status-message" style="display: none;"></div>

      <footer class="footer">
        <p>🔒 입력하신 개인정보는 신청 확인용으로만 안전하게 사용됩니다.</p>
      </footer>
    </main>
  </div>

  <script src="app.js?v=2"></script>
</body>
</html>
